[package]
name = "money-transfer-project-template-rust"
version = "0.1.0"
edition = "2024"
# The minimum supported by temporalio-sdk.
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
name = "money_transfer"

[dependencies]
temporalio-sdk = "1.0.0"
temporalio-macros = "1.0.0"
temporalio-client = "1.0.0"
temporalio-common = "1.0.0"
temporalio-workflow = "1.0.0"
futures = "0.3.32"
gethostname = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.23.4", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
temporalio-sdk = { version = "1.0.0", features = ["testing"] }
